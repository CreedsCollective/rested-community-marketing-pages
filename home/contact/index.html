<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact Evie Phillips</title>
<meta name="description" content="Send Evie Phillips a message about the rested, coaching, press or partnerships.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Gochi+Hand&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<style>
:root{--berry:#9E1F4F;--pink:#FFD6E4;--pink2:#FFC2D7;--cream:#F8F5EE;--navy:#16293A;--cobalt:#1F5BFF;--ink:#1A1D24}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:'Fraunces',Georgia,serif;-webkit-font-smoothing:antialiased}
a{color:var(--navy)}a:hover{color:var(--berry)}
a:focus-visible{outline:3px solid var(--cobalt);outline-offset:3px}
main{display:flex;justify-content:center;overflow:hidden;min-height:100vh}
.col{width:100%;max-width:440px;padding:28px 22px 48px;display:flex;flex-direction:column;gap:30px;position:relative}
.anton{font-family:'Anton',Impact,sans-serif;font-weight:400;text-transform:uppercase}
.si{font-family:'Instrument Serif',serif;font-style:italic;text-transform:none;letter-spacing:-.01em;color:var(--berry)}
.mono{font-family:'DM Mono',monospace}
.hand{font-family:'Gochi Hand',cursive}
.mark{position:relative;display:inline-block}
.mark svg{position:absolute;left:-8%;top:28%;width:116%;height:66%;pointer-events:none;z-index:0;transform:rotate(-2deg)}
.mark span{position:relative;z-index:1}
header{display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
.photo{position:relative;width:100%;max-width:330px;margin-top:18px}
.photo .frame{border:3px solid var(--ink);border-radius:22px;overflow:hidden;box-shadow:8px 8px 0 var(--berry);transform:rotate(-2deg);background:var(--ink)}
.photo img{display:block;width:100%;height:400px;object-fit:cover;object-position:50% 30%}
.sticker{position:absolute;border:2px solid var(--ink);border-radius:10px;padding:6px 14px;font-family:'Gochi Hand',cursive;box-shadow:3px 3px 0 var(--ink)}
h1{margin:22px 0 0;font-size:54px;line-height:.95;letter-spacing:.5px}
.pr{margin:0;font-size:12px;letter-spacing:1.6px;text-transform:uppercase;color:var(--navy);line-height:1.7}
.pr a{text-transform:none;letter-spacing:.4px;font-size:13px}
.social{display:flex;gap:12px}
.social a{width:46px;height:46px;border:2px solid var(--ink);border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;color:var(--ink);box-shadow:2px 2px 0 var(--ink)}
.cards{display:flex;flex-direction:column;gap:26px}
.card{position:relative;border:3px solid var(--ink);border-radius:22px;padding:26px 22px 22px;display:flex;flex-direction:column;gap:14px}
.card h2{margin:0;font-size:38px;line-height:1}
.card p{margin:0;font-size:16px;line-height:1.5;color:var(--navy)}
.tag{position:absolute;top:-16px;border-radius:8px;padding:4px 12px;font-family:'Gochi Hand',cursive;font-size:19px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:54px;border:2px solid var(--ink);border-radius:12px;font-family:'DM Mono',monospace;font-weight:500;font-size:15px;letter-spacing:2px;text-transform:uppercase;text-decoration:none;transition:transform .12s ease,box-shadow .12s ease}
.btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)!important}
.btn:active{transform:translate(3px,3px)}
footer{display:flex;justify-content:center;align-items:center;gap:10px;font-family:'Gochi Hand',cursive;font-size:20px;color:var(--navy)}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
.form{display:flex;flex-direction:column;gap:16px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
label{display:block;font-family:'DM Mono',monospace;font-weight:500;font-size:12px;letter-spacing:.16em;text-transform:uppercase;margin-bottom:8px}
label .opt{letter-spacing:.08em;color:#4A5560}
input,select,textarea{display:block;width:100%;min-height:52px;padding:12px 14px;background:#fff;border:2px solid var(--ink);border-radius:10px;font-family:'Fraunces',serif;font-size:17px;color:var(--ink)}
textarea{min-height:150px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:3px solid var(--cobalt);outline-offset:2px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
button.btn{cursor:pointer;width:100%;background:var(--berry);color:#fff;box-shadow:3px 3px 0 var(--ink)}
button.btn[disabled]{opacity:.7;cursor:wait}
.err{display:none;margin:0;color:var(--berry);font-size:15px}
.done{display:none;text-align:center}
.sent .form{display:none}.sent .done{display:block}
@media (max-width:420px){.row2{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>
<svg width="0" height="0" aria-hidden="true" style="position:absolute"><defs><filter id="ev-marker" x="-5%" y="-20%" width="110%" height="140%"><feTurbulence type="fractalNoise" baseFrequency="0.09 0.35" numOctaves="2" seed="11" result="n"></feTurbulence><feDisplacementMap in="SourceGraphic" in2="n" scale="7" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap></filter>
<g id="ev-strokes"><path d="M10 20 C 60 15, 120 13, 186 17" stroke-width="20"></path><path d="M6 36 C 64 33, 132 31, 194 34" stroke-width="22" opacity="0.9"></path><path d="M18 48 C 70 46, 128 45, 178 47" stroke-width="12" opacity="0.8"></path><path d="M186 15 C 192 24, 190 34, 194 38" stroke-width="10" opacity="0.7"></path></g></defs></svg>
<main>
<div class="col">
<a href="/links/" class="mono" style="align-self:flex-start;font-size:12px;letter-spacing:1.6px;text-transform:uppercase;text-decoration:none;min-height:44px;display:inline-flex;align-items:center">← Back</a>

<h1 class="anton" style="text-align:center;font-size:48px;line-height:1;margin:4px 0 0">Let’s <span class="mark"><svg viewBox="0 0 200 60" preserveAspectRatio="none" aria-hidden="true"><g filter="url(#ev-marker)" fill="none" stroke="#FFC2D7" stroke-linecap="round" opacity="0.95"><use href="#ev-strokes"></use></g></svg><span class="si" style="font-size:56px">talk</span></span></h1>
<p style="margin:-12px 0 0;text-align:center;font-size:17px;line-height:1.6;color:var(--navy)">Questions about the <i>rested</i>, coaching, press or a partnership? Send a note and you’ll hear back by&nbsp;email.</p>

<article id="card" class="card" style="background:#fff;box-shadow:7px 7px 0 var(--berry)">
<div class="tag" style="right:16px;background:var(--pink);color:var(--ink);border:2px solid var(--ink);transform:rotate(4deg)">I read every one</div>
<form id="cf" class="form" novalidate>
<div class="row2">
<div><label for="cf-first">First name</label><input id="cf-first" name="first_name" autocomplete="given-name" required></div>
<div><label for="cf-last">Last name <span class="opt">· optional</span></label><input id="cf-last" name="last_name" autocomplete="family-name"></div>
</div>
<div><label for="cf-email">Email</label><input id="cf-email" name="email" type="email" autocomplete="email" required></div>
<div><label for="cf-phone">Phone <span class="opt">· optional</span></label><input id="cf-phone" name="phone" type="tel" autocomplete="tel" inputmode="tel"></div>
<div><label for="cf-topic">What’s this about?</label>
<select id="cf-topic" name="topic">
<option>General question</option>
<option>The rested community</option>
<option>One-on-one coaching</option>
<option>Press, partnerships or speaking</option>
</select></div>
<div><label for="cf-msg">Message</label><textarea id="cf-msg" name="message" required></textarea></div>
<div class="hp" aria-hidden="true"><label for="cf-web">Website</label><input id="cf-web" name="website" tabindex="-1" autocomplete="off"></div>
<p id="cf-err" class="err" role="alert"></p>
<button id="cf-send" class="btn" type="submit">Send message <span aria-hidden="true">→</span></button>
<p style="margin:0;font-size:13px;color:#3F3A36">Your details only go to Evie and her team.</p>
</form>
<div class="done" role="status" aria-live="polite">
<h2 class="anton" style="font-size:40px">Message <span class="si" style="font-size:46px">sent.</span></h2>
<p style="margin-top:10px">Thank you for reaching out. You’ll hear back by&nbsp;email.</p>
<a class="btn" href="/links/" style="margin-top:18px;background:var(--ink);color:var(--cream);box-shadow:3px 3px 0 var(--cobalt)">Back to links <span aria-hidden="true">→</span></a>
</div>
</article>

<footer>
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9E1F4F" stroke-width="1.8" stroke-linecap="round"><path d="M12 3l2.2 5.6L20 9.3l-4.4 3.8 1.4 5.9L12 16l-5 3 1.4-5.9L4 9.3l5.8-.7z"></path></svg>
<a href="mailto:evie@eviephillips.com" style="text-decoration:none">evie@eviephillips.com</a>
</footer>
</div>
</main>
<script>
(function(){
  var ENDPOINT='https://waitlist.eviephillips.com/api/contact';
  var f=document.getElementById('cf'),err=document.getElementById('cf-err'),btn=document.getElementById('cf-send'),card=document.getElementById('card');
  function show(m){err.textContent=m;err.style.display='block';}
  f.addEventListener('submit',function(e){
    e.preventDefault();err.style.display='none';
    if(!f.first_name.value.trim()){show('Please add your first name.');f.first_name.focus();return;}
    if(!f.email.checkValidity()||!f.email.value.trim()){show('Please enter a valid email address.');f.email.focus();return;}
    if(f.message.value.trim().length<2){show('Please write a message.');f.message.focus();return;}
    var d={};['first_name','last_name','email','phone','topic','message','website'].forEach(function(k){d[k]=(f[k].value||'').trim();});
    btn.disabled=true;btn.firstChild.nodeValue='Sending… ';
    fetch(ENDPOINT,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(d)})
      .then(function(r){return r.json().catch(function(){return {ok:false};});})
      .then(function(j){
        if(j&&j.ok){card.classList.add('sent');card.scrollIntoView({behavior:'smooth',block:'start'});return;}
        throw new Error((j&&j.error)||'');
      })
      .catch(function(x){btn.disabled=false;btn.firstChild.nodeValue='Send message ';show(x.message||'Sorry, your message didn’t go through. Please try again, or email evie@eviephillips.com.');});
  });
})();
</script>
</body>
</html>
