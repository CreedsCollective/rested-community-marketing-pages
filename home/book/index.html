<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Book a one-on-one coaching call with Evie</title>
<meta name="description" content="Book a one-hour, one-on-one coaching call with Evie Phillips.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Gochi+Hand&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<style>
:root{--berry:#9E1F4F;--pink:#FFD6E4;--pink2:#FFC2D7;--cream:#F8F5EE;--navy:#16293A;--cobalt:#1F5BFF;--ink:#1A1D24}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:'Fraunces',Georgia,serif;-webkit-font-smoothing:antialiased}
a{color:var(--navy)}a:hover{color:var(--berry)}
a:focus-visible{outline:3px solid var(--cobalt);outline-offset:3px}
main{display:flex;justify-content:center;overflow:hidden;min-height:100vh}
.col{width:100%;max-width:440px;padding:28px 22px 48px;display:flex;flex-direction:column;gap:30px;position:relative}
.anton{font-family:'Anton',Impact,sans-serif;font-weight:400;text-transform:uppercase}
.si{font-family:'Instrument Serif',serif;font-style:italic;text-transform:none;letter-spacing:-.01em;color:var(--berry)}
.mono{font-family:'DM Mono',monospace}
.hand{font-family:'Gochi Hand',cursive}
.mark{position:relative;display:inline-block}
.mark svg{position:absolute;left:-8%;top:28%;width:116%;height:66%;pointer-events:none;z-index:0;transform:rotate(-2deg)}
.mark span{position:relative;z-index:1}
header{display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
.photo{position:relative;width:100%;max-width:330px;margin-top:18px}
.photo .frame{border:3px solid var(--ink);border-radius:22px;overflow:hidden;box-shadow:8px 8px 0 var(--berry);transform:rotate(-2deg);background:var(--ink)}
.photo img{display:block;width:100%;height:400px;object-fit:cover;object-position:82% 20%;filter:grayscale(1) contrast(1.05)}
.sticker{position:absolute;border:2px solid var(--ink);border-radius:10px;padding:6px 14px;font-family:'Gochi Hand',cursive;box-shadow:3px 3px 0 var(--ink)}
h1{margin:22px 0 0;font-size:54px;line-height:.95;letter-spacing:.5px}
.pr{margin:0;font-size:12px;letter-spacing:1.6px;text-transform:uppercase;color:var(--navy);line-height:1.7}
.pr a{text-transform:none;letter-spacing:.4px;font-size:13px}
.social{display:flex;gap:12px}
.social a{width:46px;height:46px;border:2px solid var(--ink);border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;color:var(--ink);box-shadow:2px 2px 0 var(--ink)}
.cards{display:flex;flex-direction:column;gap:26px}
.card{position:relative;border:3px solid var(--ink);border-radius:22px;padding:26px 22px 22px;display:flex;flex-direction:column;gap:14px}
.card h2{margin:0;font-size:38px;line-height:1}
.card p{margin:0;font-size:16px;line-height:1.5;color:var(--navy)}
.tag{position:absolute;top:-16px;border-radius:8px;padding:4px 12px;font-family:'Gochi Hand',cursive;font-size:19px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:54px;border:2px solid var(--ink);border-radius:12px;font-family:'DM Mono',monospace;font-weight:500;font-size:15px;letter-spacing:2px;text-transform:uppercase;text-decoration:none;transition:transform .12s ease,box-shadow .12s ease}
.btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)!important}
.btn:active{transform:translate(3px,3px)}
footer{display:flex;justify-content:center;align-items:center;gap:10px;font-family:'Gochi Hand',cursive;font-size:20px;color:var(--navy)}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
.cal{border:3px solid var(--ink);border-radius:22px;overflow:hidden;background:#fff;box-shadow:7px 7px 0 var(--cobalt)}
.cal iframe{display:block;width:100%;min-height:720px;border:none}
.price{display:flex;align-items:baseline;justify-content:center;gap:16px}
.chip{border:2px solid var(--ink);border-radius:999px;padding:6px 14px;font-family:'DM Mono',monospace;font-size:12px;letter-spacing:1.4px;text-transform:uppercase;background:var(--pink)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (min-width:900px){.col.wide{max-width:760px}}
</style>
</head>
<body>
<svg width="0" height="0" aria-hidden="true" style="position:absolute"><defs><filter id="ev-marker" x="-5%" y="-20%" width="110%" height="140%"><feTurbulence type="fractalNoise" baseFrequency="0.09 0.35" numOctaves="2" seed="11" result="n"></feTurbulence><feDisplacementMap in="SourceGraphic" in2="n" scale="7" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap></filter>
<g id="ev-strokes"><path d="M10 20 C 60 15, 120 13, 186 17" stroke-width="20"></path><path d="M6 36 C 64 33, 132 31, 194 34" stroke-width="22" opacity="0.9"></path><path d="M18 48 C 70 46, 128 45, 178 47" stroke-width="12" opacity="0.8"></path><path d="M186 15 C 192 24, 190 34, 194 38" stroke-width="10" opacity="0.7"></path></g></defs></svg>
<main>
<div class="col wide">
<a href="/links/" class="mono" style="align-self:flex-start;font-size:12px;letter-spacing:1.6px;text-transform:uppercase;text-decoration:none;min-height:44px;display:inline-flex;align-items:center">← Back</a>

<div class="photo" style="max-width:300px;align-self:center;margin-top:6px">
<div class="frame" style="box-shadow:8px 8px 0 var(--cobalt);transform:rotate(2deg)"><img src="/assets/links-hero.jpg" alt="Evie laughing with friends" style="height:320px"></div>
<div class="sticker" style="right:-12px;bottom:-18px;background:var(--pink);font-size:22px;transform:rotate(6deg)">just you + me</div>
</div>

<h1 class="anton" style="text-align:center;font-size:44px;line-height:1;margin-top:16px">One-on-one coaching with <span class="mark"><svg viewBox="0 0 200 60" preserveAspectRatio="none" aria-hidden="true"><g filter="url(#ev-marker)" fill="none" stroke="#FFC2D7" stroke-linecap="round" opacity="0.95"><use href="#ev-strokes"></use></g></svg><span class="si" style="font-size:52px">Evie</span></span></h1>

<article class="card" style="background:#fff;box-shadow:7px 7px 0 var(--berry);gap:18px">
<div class="tag" style="left:18px;background:var(--ink);color:var(--cream);transform:rotate(-4deg)">special price</div>
<div class="price">
<span class="mono" style="font-size:22px;color:#4A5560;text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:var(--berry)"><span class="sr">Regular price </span>$597</span>
<span class="anton" style="font-size:64px;line-height:1;color:var(--berry)"><span class="sr">Now </span>$333</span>
</div>
<div style="display:flex;justify-content:center;gap:10px;flex-wrap:wrap"><span class="chip">1 hour</span><span class="chip">One-on-one</span></div>
<a class="btn" href="#calendar" style="background:var(--berry);color:#fff;box-shadow:3px 3px 0 var(--ink)">Pick my time <span aria-hidden="true">↓</span></a>
<p style="text-align:center;font-size:14px">Pick your time below, then pay $333 to lock it&nbsp;in.</p>
</article>

<section id="calendar" class="cal" aria-label="Booking calendar">
<iframe src="https://api.leadconnectorhq.com/widget/booking/x4iM4qGzyKj17E8YnaS6" scrolling="no" id="x4iM4qGzyKj17E8YnaS6_booking" title="Book a one-on-one coaching call with Evie"></iframe>
</section>
<script src="https://link.msgsndr.com/js/form_embed.js" type="text/javascript"></script>

<footer>
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9E1F4F" stroke-width="1.8" stroke-linecap="round"><path d="M12 3l2.2 5.6L20 9.3l-4.4 3.8 1.4 5.9L12 16l-5 3 1.4-5.9L4 9.3l5.8-.7z"></path></svg>
<span>eviephillips.com</span>
</footer>

</div>
</main>
</body>
</html>
